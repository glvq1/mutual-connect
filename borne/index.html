<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mutual Borne – nouvelle adresse</title>
  <meta http-equiv="refresh" content="3; url=https://glvq1.github.io/mutual-borne/">
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #faf8f3; color: #3a3a3a;
      font: 500 20px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
    .carte { max-width: 620px; background: #fff; border: 2px solid #e9e1cf; border-top: 8px solid #b8a57a; border-radius: 22px; padding: 32px 28px; }
    h1 { font-size: 28px; margin: 0 0 10px; }
    a { display: inline-flex; align-items: center; justify-content: center; min-height: 68px; padding: 0 28px; margin-top: 18px;
      border-radius: 14px; background: #b8a57a; color: #fff; font-weight: 800; text-decoration: none; }
  </style>
</head>
<body>
  <div class="carte">
    <h1>La borne a changé d'adresse</h1>
    <p>Elle s'installe maintenant comme une appli à part, à côté de Mutual Connect.<br>
       Si cette borne était installée, désinstallez-la puis réinstallez-la depuis la nouvelle adresse.</p>
    <a href="https://glvq1.github.io/mutual-borne/">Ouvrir la nouvelle borne</a>
  </div>
  <script>
    // Retire l'ancien service worker de la borne et son cache
    if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => {
      if (r.scope.indexOf('/mutual-connect/borne/') !== -1) r.unregister();
    }));
    setTimeout(() => location.replace('https://glvq1.github.io/mutual-borne/'), 3000);
  </script>
</body>
</html>
